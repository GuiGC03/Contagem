<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Falta Pouquinho ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>❤️ Está quase na hora... ❤️</h1>

    <p class="texto">
        Algo muito especial está esperando por você.
    </p>

    <div id="contador">

        <div class="tempo">
            <span id="dias">00</span>
            <small>Dias</small>
        </div>

        <div class="tempo">
            <span id="horas">00</span>
            <small>Horas</small>
        </div>

        <div class="tempo">
            <span id="minutos">00</span>
            <small>Minutos</small>
        </div>

        <div class="tempo">
            <span id="segundos">00</span>
            <small>Segundos</small>
        </div>

    </div>

    <button id="botao" onclick="entrar()">
        Entrar no presente ❤️
    </button>

</div>

<script src="script.js"></script>

</body>
</html>
